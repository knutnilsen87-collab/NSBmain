name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nsb-eval:
    name: Målestokk og treningsverktøy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,engine]" ruff==0.15.20
      - run: ruff check nsb_eval nsb_engine tests scripts/build_testsets.py scripts/download_models.py scripts/py/nsb_record_interview.py src/python/nsb_train_utils.py src/python/split_by_group.py
      - run: python -m pytest
      - name: PowerShell-skript kan parses
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $e = $null; $t = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            if ($e) { $bad++; $e | ForEach-Object { Write-Host "$($f.Name):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($bad) { exit 1 }

  engine-smoke:
    name: Talemotor med ekte modell (Whisper tiny, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng
      - run: python -m pip install -e ".[dev,engine]" huggingface_hub
      - name: Hent Whisper tiny (CTranslate2)
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-tiny', local_dir='tiny')"
      - name: Røyktest (feil vises som merknader)
        shell: bash
        env:
          NSB_SMOKE_MODEL: tiny
        run: |
          set +e
          python -m pytest tests/engine/test_engine_smoke.py -v -rs -s 2>&1 | tee out.txt
          rc=${PIPESTATUS[0]}
          grep -E "WER strøm" out.txt | head -3 | while read -r l; do echo "::notice::$l"; done
          if [ $rc -ne 0 ]; then grep -E "^E |Error|FAILED" out.txt | head -25 | while read -r l; do echo "::error::$l"; done; fi
          exit $rc
      - name: Røyktesten må faktisk ha kjørt
        env:
          NSB_SMOKE_MODEL: tiny
        run: |
          python -m pytest tests/engine/test_engine_smoke.py -q -rs | tee smoke.txt
          if grep -q skipped smoke.txt; then echo "Røyktesten ble hoppet over"; exit 1; fi

  train-smoke:
    name: Treningsskript (røyktest med liten modell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]" transformers soundfile huggingface_hub
      - name: Hent Whisper-tokenizer (ingen modellvekter)
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("openai/whisper-small", local_dir="tokenizer", allow_patterns=[
              "added_tokens.json", "config.json", "generation_config.json", "merges.txt", "normalizer.json",
              "preprocessor_config.json", "special_tokens_map.json", "tokenizer.json", "tokenizer_config.json", "vocab.json"])
          PY
      - run: python -m pytest tests/train -v -rs
        env:
          NSB_TOKENIZER_DIR: tokenizer
      - name: Røyktestene må faktisk ha kjørt
        shell: bash
        env:
          NSB_TOKENIZER_DIR: tokenizer
        run: |
          python -m pytest tests/train/test_train_smoke.py -q -rs | tee smoke.txt
          if grep -q "skipped" smoke.txt; then echo "Røyktestene ble hoppet over"; exit 1; fi

  pilot-asr-api:
    name: Pilot-API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pilot-asr-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.dev.txt
      - run: python -m ruff check app tests
      - run: python -m unittest discover -s tests -v
