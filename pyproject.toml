[project]
name = "nsb-eval"
version = "1.0.0"
description = "Faste, etterprøvbare målinger av norsk talegjenkjenning (NorwegianSpeechBase)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
whisper = ["faster-whisper==1.2.1", "av>=11,<16", "huggingface_hub>=0.23,<1.0"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["nsb_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src/python"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["nsb_eval", "nsb_train_utils", "split_by_group", "pseudo_label", "app"]
